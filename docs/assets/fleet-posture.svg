<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Roboto, sans-serif" font-size="13">
  <rect width="760" height="420" fill="#fafafa"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1a202c">MCP fleet — what a per-server audit can't see</text>

  <!-- agent host -->
  <rect x="300" y="55" width="160" height="46" rx="8" fill="#2b6cb0"/>
  <text x="380" y="83" fill="#fff" text-anchor="middle" font-weight="600">Agent host (one context)</text>

  <!-- servers -->
  <g>
    <rect x="40"  y="160" width="150" height="78" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="115" y="182" text-anchor="middle" font-weight="600" fill="#c0392b">alpha-files</text>
    <text x="115" y="202" text-anchor="middle" fill="#444">http 0.0.0.0 · no TLS</text>
    <text x="115" y="220" text-anchor="middle" fill="#444">tool: read_file</text>
    <text x="115" y="234" text-anchor="middle" fill="#c0392b">run_command (shell)</text>

    <rect x="215" y="160" width="150" height="78" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="290" y="182" text-anchor="middle" font-weight="600" fill="#e67e22">bravo-github</text>
    <text x="290" y="202" text-anchor="middle" fill="#444">http 127.0.0.1 · TLS</text>
    <text x="290" y="220" text-anchor="middle" fill="#444">oauth2 + PKCE</text>
    <text x="290" y="234" text-anchor="middle" fill="#444">tool: read_file</text>

    <rect x="390" y="160" width="150" height="78" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
    <text x="465" y="182" text-anchor="middle" font-weight="600" fill="#e67e22">delta-weather</text>
    <text x="465" y="202" text-anchor="middle" fill="#444">sse 0.0.0.0 · no TLS</text>
    <text x="465" y="220" text-anchor="middle" fill="#444">no auth</text>
    <text x="465" y="234" text-anchor="middle" fill="#444">tool: get_forecast</text>

    <rect x="565" y="160" width="150" height="78" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
    <text x="640" y="182" text-anchor="middle" font-weight="600" fill="#27ae60">charlie-internal</text>
    <text x="640" y="202" text-anchor="middle" fill="#444">stdio (local)</text>
    <text x="640" y="220" text-anchor="middle" fill="#444">oauth2</text>
    <text x="640" y="234" text-anchor="middle" fill="#444">tool: search_tickets</text>
  </g>

  <!-- edges -->
  <g stroke="#90cdf4" stroke-width="2" fill="none">
    <path d="M340,101 L115,160"/>
    <path d="M360,101 L290,160"/>
    <path d="M400,101 L465,160"/>
    <path d="M420,101 L640,160"/>
  </g>

  <!-- correlation callouts -->
  <g font-size="12">
    <rect x="40" y="270" width="335" height="22" rx="4" fill="#fdecea"/>
    <text x="50" y="285" fill="#c0392b">CRIT shared_secret: alpha + bravo reuse one key</text>

    <rect x="40" y="298" width="335" height="22" rx="4" fill="#fdf0e6"/>
    <text x="50" y="313" fill="#e67e22">HIGH tool_collision: read_file on alpha &amp; bravo</text>

    <rect x="40" y="326" width="335" height="22" rx="4" fill="#fdf0e6"/>
    <text x="50" y="341" fill="#e67e22">HIGH lateral_movement: alpha RCE → delta peer</text>

    <rect x="390" y="270" width="325" height="22" rx="4" fill="#fdf0e6"/>
    <text x="400" y="285" fill="#e67e22">HIGH trust_tier: delta unauth among authed peers</text>

    <rect x="390" y="298" width="325" height="22" rx="4" fill="#fef9e7"/>
    <text x="400" y="313" fill="#9a7d0a">MED tls_inconsistency / failure_concentration</text>

    <rect x="390" y="326" width="325" height="40" rx="4" fill="#ebf8ff"/>
    <text x="400" y="343" fill="#2b6cb0" font-weight="600">Fleet grade: F</text>
    <text x="400" y="360" fill="#2b6cb0">Top priority: stop sharing one credential</text>
  </g>

  <text x="20" y="405" fill="#888" font-size="11">Diagram: generated SVG (CC0). mcpharden posture — Cognis Neural Suite.</text>
</svg>
